# Bygger appen for App Store og Google Play og laster den opp.
# Startes manuelt: GitHub → Actions → «Bygg og last opp app» → Run workflow.
# Nøklene ligger som secrets i repoet (Settings → Secrets and variables → Actions).
name: Bygg og last opp app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hvilken plattform
        type: choice
        options: [begge, ios, android]
        default: begge

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bygg nettappen og kopier til Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Hent opplastingsnøkkel
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Mangler secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bygg Android App Bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }} --no-daemon

      # Første gang må .aab-filen lastes opp manuelt i Play Console (last ned herfra)
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Senere: automatisk opplasting til «Intern testing» som utkast (rulles ut i Play Console)
      - name: Last opp til Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: no.veierland.ferge
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: no.veierland.ferge
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # App Store krever nyeste Xcode/iOS-SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bygg nettappen og kopier til iOS
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Hent App Store Connect-nøkkel
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          RAW_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Fjern mellomrom og linjeskift som lett følger med ved innliming
          KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$RAW_TEAM_ID" | tr -d '[:space:]')
          for v in KEY_P8 KEY_ID ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Mangler secret for $v (APPSTORE_KEY_P8, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPLE_TEAM_ID)"; exit 1; fi
          done
          echo "::add-mask::$TEAM_ID"
          # xcodebuild/altool forventer filnavnet AuthKey_<KEY_ID>.p8
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          {
            echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8"
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$ISSUER_ID"
            echo "TEAM_ID=$TEAM_ID"
            echo "APP_VERSION=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_ENV"

      - name: Sjekk Apple-nøkkelen og app-ID-en
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 scripts/check-appstore-key.py

      # Lager distribusjonssertifikat og App Store-profil via API-nøkkelen, og slår på manuell signering
      - name: Lag sertifikat og profil
        run: python3 scripts/ios-signing.py setup

      - name: Arkiver
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Lag .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # altool finner nøkkelen i ~/private_keys/AuthKey_<KEY_ID>.p8
      - name: Last opp til App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Sertifikatet trekkes tilbake etter hvert bygg. Bygg som er lastet opp påvirkes ikke.
      - name: Rydd opp signering
        if: always() && env.CERT_ID != ''
        run: python3 scripts/ios-signing.py cleanup
