<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#0A1620"/>

  <!-- ── FERRY SILHOUETTE (red) ── -->
  <g fill="#E60000">

    <!-- Main hull body -->
    <path d="
      M 105,670
      Q 102,740 128,768
      L 195,782
      L 822,782
      Q 886,778 928,748
      Q 956,720 960,690
      L 960,562
      Q 942,548 912,546
      L 186,546
      Q 152,550 130,570
      L 112,635
      Q 105,650 105,670
      Z
    "/>

    <!-- Stern propulsion bump (bottom-left protrusion) -->
    <path d="
      M 88,650 L 105,650 L 105,670
      Q 102,740 128,768
      L 98,768 Q 78,752 76,726
      L 76,658 Q 76,650 88,650 Z
    "/>

    <!-- Bow ramp diagonal (right side) -->
    <path d="
      M 912,546 L 960,562 L 960,546 L 944,528
      Q 926,518 912,528 Z
    "/>

    <!-- Main deck superstructure -->
    <path d="
      M 172,546 L 172,444
      Q 172,432 186,432
      L 626,432 Q 640,432 640,444
      L 640,546 Z
    "/>

    <!-- Bridge / wheelhouse -->
    <path d="
      M 554,432 L 554,340
      Q 554,328 567,328
      L 748,328 Q 762,328 762,340
      L 762,432 Z
    "/>

    <!-- Mast column -->
    <rect x="638" y="188" width="22" height="148" rx="6"/>
    <!-- Cross-arm -->
    <rect x="582" y="264" width="134" height="16" rx="5"/>
    <!-- Radar platform -->
    <rect x="628" y="250" width="42" height="20" rx="4"/>
    <!-- Top antenna -->
    <rect x="644" y="182" width="10" height="48" rx="4"/>

    <!-- Secondary radar arm on bridge -->
    <rect x="658" y="298" width="16" height="36" rx="4"/>
    <rect x="636" y="298" width="60" height="13" rx="4"/>
    <rect x="648" y="288" width="36" height="13" rx="5"/>

    <!-- Flag pole -->
    <rect x="228" y="378" width="13" height="68" rx="3"/>

    <!-- Bow navigation post -->
    <rect x="914" y="490" width="13" height="60" rx="3"/>
    <rect x="906" y="500" width="30" height="11" rx="3"/>

  </g>

  <!-- ── WHITE CUTOUTS ── -->

  <!-- Main deck — 3 horizontal window/railing slots -->
  <rect x="196" y="458" width="406" height="26" rx="5" fill="#0A1620"/>
  <rect x="196" y="499" width="406" height="26" rx="5" fill="#0A1620"/>
  <rect x="196" y="537" width="406" height="6"  rx="2" fill="#0A1620"/>

  <!-- Vertical dividers between window panels (red struts) -->
  <rect x="328" y="458" width="13" height="67" fill="#E60000"/>
  <rect x="464" y="458" width="13" height="67" fill="#E60000"/>

  <!-- Bridge windows -->
  <rect x="572" y="350" width="58" height="52" rx="7" fill="#0A1620"/>
  <rect x="648" y="350" width="58" height="52" rx="7" fill="#0A1620"/>
  <rect x="716" y="350" width="32" height="52" rx="5" fill="#0A1620"/>

  <!-- ── NORWEGIAN FLAG ── -->
  <!-- White base -->
  <rect x="240" y="380" width="52" height="34" rx="2" fill="white"/>
  <!-- Red field -->
  <rect x="240" y="380" width="52" height="34" rx="2" fill="#E60000"/>
  <!-- White cross -->
  <rect x="240" y="391" width="52" height="11" fill="white"/>
  <rect x="255" y="380" width="10" height="34" fill="white"/>
  <!-- Blue cross (inside white) -->
  <rect x="240" y="393" width="52" height="7" fill="#003087"/>
  <rect x="257" y="380" width="6" height="34" fill="#003087"/>

</svg>
